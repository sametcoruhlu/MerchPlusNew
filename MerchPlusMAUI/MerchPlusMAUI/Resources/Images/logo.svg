<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Rounded square outline with M -->
    <rect x="80" y="80" width="240" height="240" rx="20" ry="20" fill="none" stroke="#343A40" stroke-width="8"/>
    
    <!-- "M" letter inside the square -->
    <path fill="#343A40" d="M140,140 L170,140 L200,200 L230,140 L260,140 L260,280 L230,280 L230,200 L200,260 L170,200 L170,280 L140,280Z"/>
    
    <!-- Red plus sign overlapping top right corner -->
    <circle cx="320" cy="120" r="25" fill="#DC3545"/>
    <path fill="#FFFFFF" d="M310,110 L330,110 L330,130 L350,130 L350,150 L330,150 L330,170 L310,170 L310,150 L290,150 L290,130 L310,130Z"/>
    
    <!-- MERCHplus text below -->
    <text x="120" y="360" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#343A40">MERCH</text>
    <text x="240" y="360" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#DC3545">plus</text>
</svg>